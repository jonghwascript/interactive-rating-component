<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png" />

  <title>Frontend Mentor | Interactive rating component</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/style.css" />
</head>

<body>
  <div class="container center cover">
    <main id="main" class="stack rating-card">
      <div class="stack star-row">
        <div class="star-box">
          <img src="./images/icon-star.svg" alt="">
        </div>
        <div class="stack star-text">
          <h1 class="title"> How did we do?</h1>
          <p class="description">
            Please let us know how we did with your support request. All feedback is appreciated
            to help us improve our offering!
          </p>
        </div>
      </div>
      <form class="stack star-form">
        <fieldset aria-describedby="error">
          <legend class="sr-only">How did we do?</legend>
          <ul class="cluster star-column">
            <li class="item">
              <label class="rating-option" aria-label="One Star">
                <input type="radio" class="sr-only" name="rating" value="1">
                1
              </label>
            </li>
            <li class="item">
              <label class="rating-option" aria-label="Two Star">
                <input type="radio" class="sr-only" name="rating" value="2">
                2
              </label>
            </li>
            <li class="item">
              <label class="rating-option" aria-label="Three Star">
                <input type="radio" class="sr-only" name="rating" value="3">
                3
              </label>
            </li>
            <li class="item">
              <label class="rating-option" aria-label="Four Star">
                <input type="radio" class="sr-only" name="rating" value="4">
                4
              </label>
            </li>
            <li class="item">
              <label class="rating-option" aria-label="Five Star">
                <input type="radio" class="sr-only" name="rating" value="5">
                5
              </label>
            </li>
          </ul>
        </fieldset>
        <div id="error" aria-live="assertive" role="alert"></div>
        <button type="submit" class="submit-button">submit</button>
      </form>
    </main>
    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by
      <a href="https://www.frontendmentor.io/profile/jonghwascript">jonghwascript</a>.
    </footer>
  </div>
  <script src="./js/main.js"></script>
</body>

</html>
